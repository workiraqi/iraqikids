[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "iraqikids"
version = "0.2.0"
description = "Arabic creativity platform for children"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-Login>=0.6,<1",
  "Flask-WTF>=1.2,<2",
  "Flask-Limiter>=3.12,<5",
  "python-dotenv>=1.1,<2",
  "email-validator>=2.2,<3",
  "bleach>=6.2,<7",
  "Pillow>=11.3,<13",
  "requests>=2.32",
  "feedparser>=6.0,<7",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-flask>=1.3,<2",
  "pytest-cov>=6.2,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
