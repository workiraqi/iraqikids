<section class="playful-hero" aria-labelledby="hero-title">
  <div class="hero-scribble hero-scribble-one" aria-hidden="true"></div><div class="hero-scribble hero-scribble-two" aria-hidden="true"></div>
  <div class="hero-layout">
    <div class="hero-copy reveal">
      <span class="eyebrow eyebrow-bright"><i aria-hidden="true"></i>{{ site_settings.arabic_site_name }}</span>
      <h1 id="hero-title">{{ site_settings.hero_title }}</h1>
      <p>{{ site_settings.hero_subtitle }}</p>
      <div class="hero-actions"><a class="pill-button primary arrow-link" href="#creative-categories">ابدأ الاستكشاف <span aria-hidden="true">←</span></a><a class="pill-button secondary" href="#discover">اكتشف الأنشطة</a></div>
      <div class="hero-note"><span aria-hidden="true">✦</span><p><strong>مساحة آمنة للفضول</strong>أفكار مختارة للطفل، والأهل، والمعلمين.</p></div>
    </div>
    <div class="hero-collage reveal" data-parallax-zone aria-label="تكوين بصري يعبّر عن الفن والعلم والحكايات">
      <div class="collage-main"><span class="collage-orbit" aria-hidden="true"></span><div class="collage-word"><small>اسأل</small><strong>ماذا لو؟</strong></div><span class="collage-pencil" aria-hidden="true"></span></div>
      <div class="collage-card collage-card-art" data-parallax="0.45"><span>فن</span><strong>لونٌ يتحرّك</strong></div>
      <div class="collage-card collage-card-science" data-parallax="0.7"><span>علوم</span><strong>فكرةٌ تُختبر</strong></div>
      <div class="collage-sticker" data-parallax="0.35"><span>للصغار</span><b>والكبار الفضوليين</b></div>
      <span class="collage-spark spark-one" aria-hidden="true">✦</span><span class="collage-spark spark-two" aria-hidden="true">✷</span>
    </div>
  </div>
  <a class="scroll-cue" href="#creative-categories"><span>مرّر لتبدأ الرحلة</span><i aria-hidden="true">↓</i></a>
</section>
