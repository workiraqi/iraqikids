{% macro section_heading(eyebrow, title, description='', href='', link_label='عرض الكل', title_id='') %}<div class="section-heading"><div class="heading-title"><span class="eyebrow">{{ eyebrow }}</span><h2{% if title_id %} id="{{ title_id }}"{% endif %}>{{ title }}</h2></div>{% if description %}<p>{{ description }}</p>{% endif %}{% if href %}<a class="section-link arrow-link" href="{{ href }}">{{ link_label }} <span aria-hidden="true">←</span></a>{% endif %}</div>{% endmacro %}
